<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Страница с каталогом компании PcMarket">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script type="module" src="../js/main.js"></script>
    <title>Товары</title>
</head>
<body>
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>

    <header class="site-header">
        <a href="../index.html" class="site-header__link">
            <span class="site-header__name"><span class="site-header__accent">PC</span>Market</span>
        </a>
        <nav class="site-nav">
            <ul class="site-nav__list">
                <li class="site-nav__item">
                    <a href="../index.html#advantages" class="site-nav__link">Преимущества</a>
                </li>
                <li class="site-nav__item">
                    <a href="catalog.html" class="site-nav__link" aria-current="page">Каталог</a>
                </li>
                <li class="site-nav__item">
                    <a href="order.html" class="site-nav__link">Заказ</a> 
                </li>
                <li class="site-nav__item">
                    <a href="aboutUs.html" class="site-nav__link">О нас</a>
                </li>
                <li class="site-nav__item">
                    <a href="reviews.html" class="site-nav__link">Отзывы</a>
                </li>
                <li class="site-nav__item">
                    <a href="contacts.html" class="site-nav__link">Контакты</a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="main-content" tabindex="-1">
        <section class="catalog-intro">
            <h1 class="catalog-intro__title">Каталог товаров PcMarket</h1>
            <p class="catalog-intro__description">Комплектующие и готовые конфигурации ПК с официальной гарантией качества.</p>
        </section>
        
        <div class="catalog-layout">
            <aside class="catalog-filters">
                <h2 class="catalog-filters__title">Фильтры</h2>
                <form class="catalog-filters__form">
                    <fieldset class="catalog-filters__group">
                        <legend class="catalog-filters__legend">Категория</legend>
                        <label class="catalog-filters__option"><input type="checkbox" name="category" value="pc"> Готовые ПК</label>
                        <label class="catalog-filters__option"><input type="checkbox" name="category" value="gpu"> Видеокарты</label>
                    </fieldset>
                    <fieldset class="catalog-filters__group">
                        <legend class="catalog-filters__legend">Цена</legend>
                        <label class="catalog-filters__option"><input type="checkbox" name="price" value="under-100000"> До 100 000 ₽</label>
                        <label class="catalog-filters__option"><input type="checkbox" name="price" value="over-100000"> От 100 000 ₽</label>
                    </fieldset>
                    <div class="catalog-filters__actions">
                        <button class="button button--primary" type="button">Применить</button>
                        <button class="button button--secondary" type="reset">Сбросить</button>
                    </div>
                </form>
            </aside>

            <section class="catalog" aria-label="Товары каталога"></section>
        </div>
    </main>

    <footer class="site-footer">
        <p class="site-footer__text">&copy; 2026 PcMarket. Все права защищены.</p>
    </footer>

</body>
</html>
